name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Android App Build & Test
  android-build:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'android/') || github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: |
        if [ -f "android/gradlew" ]; then
          chmod +x android/gradlew
        fi
    
    - name: Build Android App
      run: |
        if [ -f "android/gradlew" ]; then
          cd android
          ./gradlew build
        else
          echo "Android project not yet initialized"
        fi
    
    - name: Run Android Tests
      run: |
        if [ -f "android/gradlew" ]; then
          cd android
          ./gradlew test
        else
          echo "Android tests not yet available"
        fi
    
    - name: Upload Android Build Artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: android-apk
        path: android/app/build/outputs/apk/**/*.apk
        if-no-files-found: ignore

  # Backend Build & Test (Python/FastAPI)
  backend-python-build:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'backend/') || github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'
    
    - name: Install dependencies
      run: |
        if [ -f "backend/requirements.txt" ]; then
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
        else
          echo "Backend requirements.txt not yet available"
        fi
    
    - name: Run Linting
      run: |
        if [ -f "backend/requirements.txt" ]; then
          cd backend
          pip install flake8 black
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          black --check . || true
        fi
    
    - name: Run Tests
      run: |
        if [ -f "backend/requirements.txt" ] && [ -d "backend/tests" ]; then
          cd backend
          pytest --cov=. --cov-report=xml
        else
          echo "Backend tests not yet available"
        fi
    
    - name: Upload Coverage
      if: success()
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

  # Backend Build & Test (Node.js/Express)
  backend-node-build:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'backend/') || github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'
    
    - name: Install dependencies
      run: |
        if [ -f "backend/package.json" ]; then
          cd backend
          npm ci
        else
          echo "Backend package.json not yet available"
        fi
    
    - name: Run Linting
      run: |
        if [ -f "backend/package.json" ]; then
          cd backend
          npm run lint || true
        fi
    
    - name: Run Tests
      run: |
        if [ -f "backend/package.json" ]; then
          cd backend
          npm test
        else
          echo "Backend tests not yet available"
        fi

  # Docker Build
  docker-build:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'backend/') || github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker Image
      run: |
        if [ -f "backend/Dockerfile" ]; then
          cd backend
          docker build -t sabsteckapi-backend:latest .
        else
          echo "Dockerfile not yet available"
        fi

  # Documentation Check
  docs-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check Markdown Links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/markdown-link-check-config.json'
        folder-path: 'docs/'
      continue-on-error: true
    
    - name: Lint Markdown
      run: |
        npm install -g markdownlint-cli
        markdownlint '**/*.md' --ignore node_modules --ignore .git || true
